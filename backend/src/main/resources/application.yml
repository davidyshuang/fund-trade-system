server:
  # Render 等 PaaS 通过 PORT 环境变量指定监听端口；本地默认 8080
  port: ${PORT:8080}

spring:
  datasource:
    # 默认连接本机 Homebrew PostgreSQL；部署/CI 可用环境变量覆盖（见 .github/workflows/ci.yml）
    # Neon 等云数据库强制 SSL，需设置 DB_SSLMODE=require；本机 PG 默认 disable
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fund_trade}?sslmode=${DB_SSLMODE:disable}
    username: ${DB_USERNAME:${USER}}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      # 表结构与演示数据由 DatabaseInitializer 统一管理（幂等）
      mode: never
