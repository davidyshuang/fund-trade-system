# Cloudflare Pages 部署配置（wrangler v4+ 用 `npx wrangler deploy`）
# 用法：在 frontend/ 目录执行
#   1) VITE_API_BASE=https://fund-trade-system.onrender.com npm run build   # 生成 dist
#   2) npx wrangler deploy                                                   # 部署 dist（此配置指定）
name = "fund-trade-system"
compatibility_date = "2026-08-30"

# 关键：指定部署构建产物目录（必须是 dist，不是源码 src！）
pages_build_output_dir = "dist"
