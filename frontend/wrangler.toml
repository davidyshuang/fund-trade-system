# Cloudflare Pages 部署配置（wrangler v4+，配合 `npx wrangler deploy`）
# 用法：在 frontend/ 目录执行
#   1) VITE_API_BASE=https://fund-trade-system.onrender.com npm run build   # 生成 dist
#   2) npx wrangler deploy                                                   # 上传 dist（见下方 [assets]）
name = "fund-trade-system"
compatibility_date = "2026-08-30"

# wrangler v4 部署静态资产（新版语法，兼容 Cloudflare 云端 Deploy command）
[assets]
directory = "./dist"
# SPA 路由回退：直接访问 /orders 等路径时返回 index.html
not_found_handling = "single-page-application"
