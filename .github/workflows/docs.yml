# 文档站发布：mkdocs 构建 → GitHub Pages
# 触发：docs/ 或 mkdocs.yml 变更时自动重新发布
name: Docs

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 mkdocs-material
        run: pip install mkdocs-material

      - name: 构建并发布到 GitHub Pages (gh-pages 分支)
        run: mkdocs gh-deploy --force --verbose
